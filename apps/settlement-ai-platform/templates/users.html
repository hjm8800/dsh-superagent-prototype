{% extends "base.html" %}
{% block title %}用户管理 · 结算AI工作台{% endblock %}
{% block content %}
<div class="page-head"><div><h1>用户管理</h1><p class="sub">本地账号，不接 SSO；新用户创建后由项目管理员加入项目。</p></div></div>
<section class="card">
  <div class="card-head"><h2>新建用户</h2></div>
  <form class="inline" method="post" action="/admin/users">
    <input name="username" placeholder="账号" required>
    <input name="name" placeholder="姓名" required>
    <select name="role"><option value="engineer">工程部</option><option value="settlement">市场部</option><option value="material">物资组</option><option value="manager">项目经理</option><option value="admin">系统管理员</option></select>
    <input name="password" type="password" placeholder="初始密码（至少6位）" required minlength="6">
    <button class="btn primary" type="submit">创建</button>
  </form>
</section>
<section class="card">
  <div class="card-head"><h2>用户列表</h2><span class="muted">{{ users|length }} 人</span></div>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>姓名</th><th>账号</th><th>角色</th><th>重置密码</th></tr></thead>
      <tbody>
      {% for u in users %}
        <tr><td class="strong">{{ u.name }}</td><td>{{ u.username }}</td><td><span class="badge info">{{ u.role }}</span></td>
          <td><form class="inline" method="post" action="/admin/users/{{ u.id }}/reset"><input class="tiny" name="password" type="password" placeholder="新密码" required minlength="6"><button class="btn small" type="submit">重置</button></form></td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
