{% extends "base.html" %}
{% block title %}账号 · 结算AI工作台{% endblock %}
{% block content %}
<div class="page-head"><div><h1>账号</h1><p class="sub">{{ user.name }} · {{ user.username }}</p></div></div>
<section class="card" style="max-width:620px">
  <div class="card-head"><h2>修改密码</h2><span class="badge info">{{ user.role }}</span></div>
  <form class="form" method="post" action="/account/password">
    <label>当前密码<input name="current" type="password" required autocomplete="current-password"></label>
    <label>新密码<input name="new" type="password" required minlength="6" autocomplete="new-password"></label>
    <button class="btn primary" type="submit">保存</button>
  </form>
  <p class="muted small">本地账号，不接 SSO。首次登录后请立即修改默认密码。</p>
</section>
{% endblock %}
